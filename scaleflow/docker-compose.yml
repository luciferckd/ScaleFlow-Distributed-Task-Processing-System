services:
  redis:
    image: redis:7-alpine
    container_name: scaleflow-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  api:
    build:
      context: ./api_gateway
      dockerfile: Dockerfile
    container_name: scaleflow-api
    ports:
      - "5000:5000"
    env_file:
      - ./api_gateway/.env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DB_HOST: host.docker.internal
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health/live', (res) => process.exit(res.statusCode === 200 ? 0 : 1))"]
      interval: 15s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: ./api_gateway/worker
      dockerfile: Dockerfile
    env_file:
      - ./api_gateway/worker/.env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DB_HOST: host.docker.internal
      CRASH_TEST: "false"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  redis_data: